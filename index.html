<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEON STRIKER</title>
<style>
:root{--neon-cyan:#00f0ff;--neon-magenta:#ff00d4;--neon-yellow:#ffe600;--neon-red:#ff2a4d;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;}
body{display:flex;justify-content:center;align-items:center;font-family:sans-serif;background:radial-gradient(ellipse at center,#0d1430 0%,#05060d 70%,#000 100%);}
#game-wrap{position:relative;width:min(100vh*9/16,100vw);height:min(100vh,100vw*16/9);aspect-ratio:9/16;max-width:720px;max-height:1280px;background:#05060d;border:2px solid var(--neon-cyan);border-radius:4px;box-shadow:0 0 30px rgba(0,240,255,0.3);overflow:hidden;}
#game{width:100%;height:100%;display:block;background:#05060d;}
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="720" height="1280"></canvas>
</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=720,H=1280;
const C={cyan:'#00f0ff',magenta:'#ff00d4',yellow:'#ffe600',red:'#ff2a4d',green:'#00ff9c',white:'#e0f7ff'};

// Load images
const assets={};
let imgsLoaded=0;
function loadImg(key,src){
  const img=new Image();
  img.onload=()=>{imgsLoaded++;};
  img.onerror=()=>{imgsLoaded++;};
  img.src=src;
  assets[key]=img;
}
loadImg('player','assets/sprites/player.png');
loadImg('enemy','assets/sprites/enemy.png');
loadImg('boss1','assets/sprites/boss_1.png');
loadImg('boss2','assets/sprites/boss_2.png');
loadImg('boss3','assets/sprites/boss_3.png');

// BGM setup
const bgm=new Audio('assets/audio/bgm.mp3');
bgm.loop=true;
bgm.volume=0.5;
let bgmStarted=false;
function startBGM(){
  if(!bgmStarted){
    bgm.play().then(()=>{bgmStarted=true;}).catch(()=>{
      // Browser blocked autoplay - wait for user interaction
      document.addEventListener('click', function once(){
        bgm.play().then(()=>{bgmStarted=true;}).catch(()=>{});
        document.removeEventListener('click',once);
      });
      document.addEventListener('keydown', function once(){
        bgm.play().then(()=>{bgmStarted=true;}).catch(()=>{});
        document.removeEventListener('keydown',once);
      });
    });
  }
}
function stopBGM(){bgm.pause();bgm.currentTime=0;bgmStarted=false;}
function pauseBGM(){bgm.pause();}
function resumeBGM(){if(bgmStarted)bgm.play().catch(()=>{});}

// Game state
let state='loading',score=0,gameTime=0,lastTime=0;
let level=1,wave=0,spawnTimer=0,bossSpawned=false,bossDefeated=false;
const keys={};

window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if(state==='menu'&&(e.key==='Enter'||e.key===' '))startGame();
  if(state==='levelclear'&&(e.key==='Enter'||e.key===' '))nextLevel();
  if(state==='gameover'&&(e.key==='Enter'||e.key===' '))startGame();
  if(state==='playing'&&e.key.toLowerCase()==='p'){state='paused';pauseBGM();}
  else if(state==='paused'&&e.key.toLowerCase()==='p'){state='playing';resumeBGM();}
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

const player={x:W/2,y:H-100,w:40,h:50,speed:5,hp:3,maxHp:3,fireCooldown:0,invincible:0,power:1};
let bullets=[],enemies=[],enemyBullets=[],particles=[],items=[];
let stars=[];
for(let i=0;i<100;i++){stars.push({x:Math.random()*W,y:Math.random()*H,speed:0.5+Math.random()*2,size:Math.random()*2+0.5});}

// Level configs
const levels=[
  {name:'LEVEL 1',enemyHp:1,enemySpeed:2,spawnRate:2,maxWaves:10,bossHp:40,bossType:'boss1'},
  {name:'LEVEL 2',enemyHp:2,enemySpeed:2.5,spawnRate:1.5,maxWaves:12,bossHp:60,bossType:'boss2'},
  {name:'LEVEL 3',enemyHp:3,enemySpeed:3,spawnRate:1.2,maxWaves:15,bossHp:80,bossType:'boss3'}
];

function spawnEnemy(type){
  const lv=levels[level-1];
  const cfgs={
    small:{w:30,h:30,hp:lv.enemyHp,speed:lv.enemySpeed,score:100,color:C.cyan},
    medium:{w:40,h:40,hp:lv.enemyHp*3,speed:lv.enemySpeed*0.8,score:250,color:C.magenta},
    large:{w:60,h:60,hp:lv.enemyHp*6,speed:lv.enemySpeed*0.6,score:500,color:C.yellow}
  };
  const c=cfgs[type]||cfgs.small;
  enemies.push({type,x:50+Math.random()*(W-100),y:-c.h,w:c.w,h:c.h,hp:c.h,maxHp:c.h,speed:c.speed,score:c.score,color:c.color,shootCooldown:1+Math.random()*2});
}

function spawnBoss(){
  const lv=levels[level-1];
  const bossImgs={boss1:assets.boss1,boss2:assets.boss2,boss3:assets.boss3};
  enemies.push({type:'boss',bossType:lv.bossType,x:W/2,y:-100,w:120,h:100,hp:lv.bossHp,maxHp:lv.bossHp,speed:0.5,score:5000,color:C.red,shootCooldown:0.5,pattern:0,patternTimer:0});
}

function fireBullet(){
  const p=player.power;
  bullets.push({x:player.x,y:player.y-30,vx:0,vy:-10,dmg:1,w:4,h:15,color:C.cyan});
  if(p>=2){bullets.push({x:player.x-20,y:player.y-25,vx:0,vy:-10,dmg:1,w:3,h:12,color:C.cyan});bullets.push({x:player.x+20,y:player.y-25,vx:0,vy:-10,dmg:1,w:3,h:12,color:C.cyan});}
  if(p>=3){bullets.push({x:player.x-15,y:player.y-20,vx:-2,vy:-9,dmg:1,w:3,h:12,color:C.magenta});bullets.push({x:player.x+15,y:player.y-20,vx:2,vy:-9,dmg:1,w:3,h:12,color:C.magenta});}
}

function enemyFire(e){
  const dx=player.x-e.x,dy=player.y-e.y,d=Math.sqrt(dx*dx+dy*dy);
  enemyBullets.push({x:e.x,y:e.y+e.h/2,vx:(dx/d)*4,vy:(dy/d)*4,w:8,h:8,color:e.color});
}

function bossFire(b){
  b.patternTimer++;
  if(b.patternTimer>60){b.patternTimer=0;b.pattern=(b.pattern+1)%3;}
  if(b.pattern===0){for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2+gameTime;enemyBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,w:10,h:10,color:C.red});}}
  else if(b.pattern===1){for(let i=-2;i<=2;i++){enemyBullets.push({x:b.x+i*20,y:b.y+30,vx:0,vy:5,w:8,h:12,color:C.yellow});}}
  else{const dx=player.x-b.x,dy=player.y-b.y,d=Math.sqrt(dx*dx+dy*dy);for(let i=-1;i<=1;i++){const a=Math.atan2(dy,dx)+i*0.3;enemyBullets.push({x:b.x,y:b.y+30,vx:Math.cos(a)*4,vy:Math.sin(a)*4,w:8,h:8,color:C.magenta});}}
}

function addParticle(x,y,color,count){for(let i=0;i<count;i++){particles.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:1,color,size:2+Math.random()*3});}}

function rectHit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2;}

function startGame(){
  if(state==='loading')return;
  state='playing';score=0;gameTime=0;level=1;
  player.x=W/2;player.y=H-100;player.hp=player.maxHp;player.invincible=0;player.power=1;
  bullets=[];enemies=[];enemyBullets=[];particles=[];items=[];
  wave=0;spawnTimer=0;bossSpawned=false;bossDefeated=false;
  startBGM();
}

function nextLevel(){
  level++;
  if(level>3){state='victory';return;}
  state='playing';
  player.hp=Math.min(player.maxHp,player.hp+1);
  bullets=[];enemies=[];enemyBullets=[];particles=[];items=[];
  wave=0;spawnTimer=0;bossSpawned=false;bossDefeated=false;
}

function update(dt){
  gameTime+=dt;
  for(const s of stars){s.y+=s.speed;if(s.y>H){s.y=0;s.x=Math.random()*W;}}
  if(state!=='playing')return;
  
  const lv=levels[level-1];
  
  if(!bossSpawned){
    spawnTimer+=dt;
    if(spawnTimer>lv.spawnRate&&enemies.length<5){
      spawnTimer=0;
      const r=Math.random();
      if(wave>=lv.maxWaves*0.6&&r<0.3)spawnEnemy('large');
      else if(wave>=lv.maxWaves*0.3&&r<0.5)spawnEnemy('medium');
      else spawnEnemy('small');
      wave++;
    }
    if(wave>=lv.maxWaves&&!bossSpawned){bossSpawned=true;spawnBoss();}
  }
  
  if(keys['arrowleft']||keys['a'])player.x-=player.speed;
  if(keys['arrowright']||keys['d'])player.x+=player.speed;
  if(keys['arrowup']||keys['w'])player.y-=player.speed;
  if(keys['arrowdown']||keys['s'])player.y+=player.speed;
  player.x=Math.max(25,Math.min(W-25,player.x));player.y=Math.max(25,Math.min(H-25,player.y));
  player.fireCooldown-=dt;
  if((keys[' ']||keys['z'])&&player.fireCooldown<=0){fireBullet();player.fireCooldown=0.1;}
  if(player.invincible>0)player.invincible-=dt;
  
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx;b.y+=b.vy;
    if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20){bullets.splice(i,1);continue;}
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(rectHit(b,e)){e.hp-=b.dmg;addParticle(b.x,b.y,C.cyan,4);bullets.splice(i,1);
        if(e.hp<=0){
          score+=e.score;addParticle(e.x,e.y,e.color,15);addParticle(e.x,e.y,C.white,8);
          if(e.type==='boss'){
            bossDefeated=true;
            if(level>=3){state='victory';stopBGM();}
            else{state='levelclear';}
          }else if(Math.random()<0.2){const t=Math.random()<0.5?'power':'hp';items.push({x:e.x,y:e.y,type:t});}
          enemies.splice(j,1);
        }
        break;
      }
    }
  }
  
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.type==='boss'){
      e.y+=e.speed;if(e.y>150)e.y=150;
      e.x+=Math.sin(gameTime*2)*2;
      e.shootCooldown-=dt;
      if(e.shootCooldown<=0){bossFire(e);e.shootCooldown=0.8;}
    }else{
      e.y+=e.speed;
      e.shootCooldown-=dt;
      if(e.shootCooldown<=0&&e.y>0&&e.y<H*0.6){enemyFire(e);e.shootCooldown=2+Math.random()*2;}
      if(e.y>H+50){enemies.splice(i,1);continue;}
    }
    if(player.invincible<=0&&rectHit(player,e)){player.hp--;player.invincible=2;addParticle(e.x,e.y,e.color,15);enemies.splice(i,1);if(player.hp<=0){state='gameover';stopBGM();}}
  }
  
  for(let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];b.x+=b.vx;b.y+=b.vy;
    if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20){enemyBullets.splice(i,1);continue;}
    if(player.invincible<=0){const pb={x:player.x,y:player.y,w:20,h:20};if(rectHit(pb,b)){player.hp--;player.invincible=2;addParticle(player.x,player.y,C.red,20);enemyBullets.splice(i,1);if(player.hp<=0){state='gameover';stopBGM();}}}
  }
  
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.y+=2;
    if(it.y>H+20){items.splice(i,1);continue;}
    if(Math.abs(it.x-player.x)<20&&Math.abs(it.y-player.y)<20){if(it.type==='power')player.power=Math.min(3,player.power+1);else if(it.type==='hp')player.hp=Math.min(player.maxHp,player.hp+1);items.splice(i,1);}
  }
  
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.life-=dt*2;if(p.life<=0)particles.splice(i,1);}
}

function drawShip(x,y,w,h,color,isPlayer){
  const img=isPlayer?assets.player:assets.enemy;
  if(img&&img.complete&&img.naturalWidth>0){
    ctx.save();ctx.translate(x,y);ctx.shadowColor=color;ctx.shadowBlur=15;
    if(isPlayer){ctx.drawImage(img,-w/2,-h/2,w,h);}
    else{ctx.scale(1,-1);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.scale(1,-1);}
    ctx.shadowBlur=0;ctx.restore();
  }else{
    ctx.save();ctx.translate(x,y);ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=15;ctx.beginPath();
    if(isPlayer){ctx.moveTo(0,-h/2);ctx.lineTo(-w/2,h/2);ctx.lineTo(-w/4,h/3);ctx.lineTo(0,h/2);ctx.lineTo(w/4,h/3);ctx.lineTo(w/2,h/2);}
    else{ctx.moveTo(0,h/2);ctx.lineTo(-w/2,-h/2);ctx.lineTo(-w/4,-h/3);ctx.lineTo(0,-h/2);ctx.lineTo(w/4,-h/3);ctx.lineTo(w/2,-h/2);}
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=C.white;ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

function drawBoss(x,y,w,h,bossType){
  const typeToImg={boss1:assets.boss1,boss2:assets.boss2,boss3:assets.boss3};
  const img=typeToImg[bossType]||assets.boss1;
  if(img&&img.complete&&img.naturalWidth>0){
    ctx.save();ctx.translate(x,y);ctx.shadowColor=C.red;ctx.shadowBlur=20;ctx.drawImage(img,-w/2,-h/2,w,h);ctx.shadowBlur=0;ctx.restore();
  }else{
    ctx.save();ctx.translate(x,y);ctx.fillStyle=C.red;ctx.shadowColor=C.red;ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(-w/2,-h/4);ctx.lineTo(-w/3,-h/2);ctx.lineTo(w/3,-h/2);ctx.lineTo(w/2,-h/4);ctx.closePath();ctx.fill();ctx.fillStyle=C.yellow;ctx.shadowColor=C.yellow;ctx.beginPath();ctx.arc(-30,0,8,0,Math.PI*2);ctx.arc(30,0,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=C.white;ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('BOSS',0,-10);ctx.restore();
  }
}

function drawItem(it){
  ctx.save();ctx.translate(it.x,it.y);const color=it.type==='power'?C.magenta:C.green;ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(12,0);ctx.lineTo(0,12);ctx.lineTo(-12,0);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=C.white;ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(it.type==='power'?'P':'H',0,4);ctx.restore();
}

function drawHUD(){
  const lv=levels[level-1];
  ctx.save();ctx.fillStyle=C.cyan;ctx.font='bold 24px sans-serif';ctx.textAlign='left';ctx.shadowColor=C.cyan;ctx.shadowBlur=10;
  ctx.fillText('SCORE: '+score,20,40);
  ctx.textAlign='center';ctx.fillStyle=C.yellow;ctx.shadowColor=C.yellow;ctx.fillText(lv.name,W/2,40);
  ctx.textAlign='right';ctx.fillStyle=C.cyan;ctx.fillText('POWER: '+player.power,W-20,40);
  ctx.textAlign='left';ctx.font='bold 16px sans-serif';ctx.fillStyle=C.white;ctx.shadowColor=C.white;ctx.shadowBlur=5;
  ctx.fillText('HP: ',20,70);
  for(let i=0;i<player.maxHp;i++){ctx.fillStyle=i<player.hp?C.red:'#333';ctx.shadowColor=i<player.hp?C.red:'#000';ctx.fillRect(60+i*30,58,20,12);}
  ctx.restore();
}

function drawLoading(){
  ctx.save();ctx.textAlign='center';ctx.font='bold 40px sans-serif';ctx.fillStyle=C.cyan;ctx.shadowColor=C.cyan;ctx.shadowBlur=20;ctx.fillText('LOADING...',W/2,H/2);ctx.font='20px sans-serif';ctx.fillStyle=C.white;ctx.shadowBlur=5;ctx.fillText(imgsLoaded+'/5 ASSETS LOADED',W/2,H/2+40);ctx.restore();
}

function drawMenu(){
  ctx.save();ctx.textAlign='center';ctx.font='bold 60px sans-serif';ctx.fillStyle=C.cyan;ctx.shadowColor=C.cyan;ctx.shadowBlur=30;ctx.fillText('NEON',W/2,400);ctx.fillStyle=C.magenta;ctx.shadowColor=C.magenta;ctx.fillText('STRIKER',W/2,480);ctx.font='24px sans-serif';ctx.fillStyle=C.white;ctx.shadowColor=C.white;ctx.shadowBlur=5;ctx.fillText('PRESS ENTER OR SPACE TO START',W/2,600);ctx.font='18px sans-serif';ctx.fillStyle='#888';ctx.shadowBlur=0;ctx.fillText('ARROW KEYS / WASD: MOVE',W/2,700);ctx.fillText('SPACE / Z: FIRE',W/2,730);ctx.fillText('P: PAUSE',W/2,760);ctx.fillText('3 LEVELS + 3 BOSSES',W/2,820);ctx.restore();
}

function drawLevelClear(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='bold 50px sans-serif';ctx.fillStyle=C.green;ctx.shadowColor=C.green;ctx.shadowBlur=30;ctx.fillText('LEVEL '+level+' CLEAR!',W/2,H/2-50);ctx.font='bold 30px sans-serif';ctx.fillStyle=C.yellow;ctx.shadowColor=C.yellow;ctx.fillText('SCORE: '+score,W/2,H/2+20);ctx.font='20px sans-serif';ctx.fillStyle=C.white;ctx.shadowColor=C.white;ctx.shadowBlur=5;ctx.fillText('PRESS ENTER FOR NEXT LEVEL',W/2,H/2+100);ctx.restore();
}

function drawVictory(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='bold 60px sans-serif';ctx.fillStyle=C.yellow;ctx.shadowColor=C.yellow;ctx.shadowBlur=40;ctx.fillText('VICTORY!',W/2,H/2-80);ctx.font='bold 30px sans-serif';ctx.fillStyle=C.cyan;ctx.shadowColor=C.cyan;ctx.shadowBlur=20;ctx.fillText('ALL BOSSES DEFEATED',W/2,H/2);ctx.font='bold 40px sans-serif';ctx.fillStyle=C.magenta;ctx.shadowColor=C.magenta;ctx.fillText('FINAL SCORE: '+score,W/2,H/2+80);ctx.font='20px sans-serif';ctx.fillStyle=C.white;ctx.shadowBlur=0;ctx.fillText('PRESS ENTER TO PLAY AGAIN',W/2,H/2+160);ctx.restore();
}

function drawGameOver(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='bold 50px sans-serif';ctx.fillStyle=C.red;ctx.shadowColor=C.red;ctx.shadowBlur=30;ctx.fillText('GAME OVER',W/2,500);ctx.font='bold 30px sans-serif';ctx.fillStyle=C.yellow;ctx.shadowColor=C.yellow;ctx.fillText('SCORE: '+score,W/2,580);ctx.font='20px sans-serif';ctx.fillStyle=C.white;ctx.shadowColor=C.white;ctx.shadowBlur=5;ctx.fillText('PRESS ENTER TO RESTART',W/2,680);ctx.restore();
}

function drawPause(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='bold 40px sans-serif';ctx.fillStyle=C.cyan;ctx.shadowColor=C.cyan;ctx.shadowBlur=20;ctx.fillText('PAUSED',W/2,H/2);ctx.font='20px sans-serif';ctx.fillStyle=C.white;ctx.shadowBlur=0;ctx.fillText('PRESS P TO RESUME',W/2,H/2+40);ctx.restore();
}

function render(){
  ctx.fillStyle='#05060d';ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.fillStyle='rgba(255,255,255,'+(0.3+s.speed/4)+')';ctx.fillRect(s.x,s.y,s.size,s.size);}
  if(state==='loading'){drawLoading();if(imgsLoaded>=5)state='menu';return;}
  if(state==='menu'){drawMenu();return;}
  if(state==='levelclear'){drawLevelClear();return;}
  if(state==='victory'){drawVictory();return;}
  
  for(const b of bullets){ctx.save();ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=10;ctx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);ctx.restore();}
  for(const b of enemyBullets){ctx.save();ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(b.x,b.y,b.w/2,0,Math.PI*2);ctx.fill();ctx.restore();}
  
  for(const e of enemies){
    if(e.type==='boss'){
      drawBoss(e.x,e.y,e.w,e.h,e.bossType);
      const bw=(e.hp/e.maxHp)*(W-100);
      ctx.fillStyle='#333';ctx.fillRect(50,110,W-100,10);
      ctx.fillStyle=C.red;ctx.shadowColor=C.red;ctx.shadowBlur=10;ctx.fillRect(50,110,bw,10);ctx.shadowBlur=0;
    }else{
      drawShip(e.x,e.y,e.w,e.h,e.color,false);
      if(e.hp<e.maxHp){const bw=(e.hp/e.maxHp)*e.w;ctx.fillStyle='#333';ctx.fillRect(e.x-e.w/2,e.y-e.h/2-10,e.w,3);ctx.fillStyle=C.red;ctx.fillRect(e.x-e.w/2,e.y-e.h/2-10,bw,3);}
    }
  }
  for(const it of items){drawItem(it);}
  if(state!=='gameover'||player.hp>0){if(player.invincible<=0||Math.floor(player.invincible*10)%2===0){drawShip(player.x,player.y,player.w,player.h,C.cyan,true);}}
  for(const p of particles){ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=5;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);ctx.restore();}
  if(state==='playing'||state==='paused')drawHUD();
  if(state==='paused')drawPause();
  if(state==='gameover')drawGameOver();
}

function loop(time){if(!lastTime)lastTime=time;const dt=Math.min((time-lastTime)/1000,0.05);lastTime=time;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
